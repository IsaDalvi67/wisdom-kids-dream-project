<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WKDP Staff Verification</title>
<style>
:root{--g:#0b5b48;--gd:#073f33;--gold:#e8b84f;--bg:#f5f7f5;--line:#dce5e0;--ink:#1d2b27;--muted:#68766f}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.wrap{max-width:1150px;margin:auto;padding:20px}
header{background:var(--gd);color:white;padding:20px 0}h1{margin:0;font-family:Georgia,serif;font-weight:500}.muted{color:var(--muted)}
.card{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin:16px 0}.login{max-width:430px;margin:9vh auto}
input,select{padding:10px 11px;border:1px solid #adbbb4;border-radius:5px;width:100%}label{display:block;font-weight:700;font-size:.88rem;margin:10px 0 6px}
.btn{border:0;border-radius:5px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:white}.secondary{background:#edf3f0;color:var(--ink)}.reject{background:#f8e0e0;color:#7b2020}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{font-size:2rem;display:block}.toolbar{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:.8rem;color:var(--muted)}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:.78rem;font-weight:800}.Pending{background:#fff0c7;color:#715400}.Verified{background:#dff4e7;color:#155b39}.Rejected{background:#f7dddd;color:#7c2222}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px}.modal.hidden,.hidden{display:none}.modal-card{background:white;border-radius:9px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}
.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{padding:11px;background:#f8faf9;border:1px solid var(--line);border-radius:5px}.detail small{display:block;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:700px){.stats,.toolbar,.details{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<section id="login-view" class="wrap">
  <div class="card login">
    <h1>WKDP Staff Verification</h1>
    <p class="muted">Authorized school staff only.</p>
    <label>Username</label><input id="username" autocomplete="username">
    <label>Password</label><input id="password" type="password" autocomplete="current-password">
    <button class="btn primary" id="login" style="width:100%;margin-top:14px">Sign In</button>
    <p id="login-msg" class="muted"></p>
  </div>
</section>

<div id="app-view" class="hidden">
<header><div class="wrap top-actions"><div><h1>WKDP Staff Verification</h1><div id="who"></div></div><button class="btn secondary" id="logout">Log Out</button></div></header>
<main class="wrap">
<section class="stats">
  <div class="card stat"><span class="muted">Pending</span><strong id="pending">0</strong></div>
  <div class="card stat"><span class="muted">Verified</span><strong id="verified">0</strong></div>
  <div class="card stat"><span class="muted">Rejected</span><strong id="rejected">0</strong></div>
</section>
<section class="card">
  <div class="toolbar">
    <div><label>Search</label><input id="search" placeholder="Donation Number, donor name or email"></div>
    <div><label>Status</label><select id="filter"><option>All</option><option>Pending</option><option>Verified</option><option>Rejected</option></select></div>
    <button class="btn primary" id="refresh">Refresh</button>
  </div>
</section>
<section class="card table-wrap">
<table><thead><tr><th>Donation</th><th>Donor</th><th>Amount</th><th>Method</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="rows"></tbody></table>
</section>
<p class="muted">Verify only after checking the emailed proof and the actual school bank/UPI transaction.</p>
</main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card">
<div class="top-actions"><div><h2 id="m-ref"></h2><span id="m-status"></span></div><button class="btn secondary" id="close">Close</button></div>
<div id="details" class="details" style="margin-top:14px"></div>
<div class="actions">
  <button class="btn primary" id="mark-verified">Mark Verified</button>
  <button class="btn reject" id="mark-rejected">Mark Rejected</button>
  <button class="btn secondary" id="mark-pending">Return to Pending</button>
</div>
<p id="action-msg" class="muted"></p>
</div></div>

<script>
let token=sessionStorage.getItem('wkdp_staff_token')||'', records=[], selected=null;
const api=async(path,opt={})=>{
  opt.headers={...(opt.headers||{}),...(token?{'Authorization':'Bearer '+token}:{})};
  const r=await fetch('/.netlify/functions/'+path,opt);const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||'Request failed');return d;
};
function showApp(name){document.getElementById('login-view').classList.add('hidden');document.getElementById('app-view').classList.remove('hidden');document.getElementById('who').textContent='Signed in as '+name;load()}
document.getElementById('login').onclick=async()=>{
  const msg=document.getElementById('login-msg');msg.textContent='Signing in…';
  try{const d=await api('staff-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});token=d.token;sessionStorage.setItem('wkdp_staff_token',token);msg.textContent='';showApp(d.username)}
  catch(e){msg.textContent=e.message}
};
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('wkdp_staff_token');location.reload()};
async function load(){try{const d=await api('staff-list');records=d.records;render()}catch(e){if(/unauthorized|expired/i.test(e.message)){sessionStorage.removeItem('wkdp_staff_token');location.reload()}else alert(e.message)}}
function render(){
  const q=search.value.trim().toLowerCase(), f=filter.value;
  pending.textContent=records.filter(x=>x.status==='Pending').length;verified.textContent=records.filter(x=>x.status==='Verified').length;rejected.textContent=records.filter(x=>x.status==='Rejected').length;
  const shown=records.filter(x=>(f==='All'||x.status===f)&&(!q||[x.donation_ref,x.donor_name,x.donor_email,x.donor_phone].join(' ').toLowerCase().includes(q)));
  rows.innerHTML=shown.map(x=>`<tr><td><b>${esc(x.donation_ref)}</b></td><td>${esc(x.donor_name)}<br><small>${esc(x.donor_email)}</small></td><td>₹${Number(x.amount).toLocaleString('en-IN')}</td><td>${esc(x.payment_method)}</td><td><span class="badge ${x.status}">${x.status}</span></td><td>${new Date(x.created_at).toLocaleString('en-IN')}</td><td><button class="btn secondary" onclick="openRecord('${x.donation_ref}')">Open</button></td></tr>`).join('')||'<tr><td colspan="7">No matching donations.</td></tr>';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openRecord(ref){
  selected=records.find(x=>x.donation_ref===ref);if(!selected)return;
  document.getElementById('m-ref').textContent=selected.donation_ref;
  document.getElementById('m-status').innerHTML='<span class="badge '+selected.status+'">'+selected.status+'</span>';
  const fields=[['Donor name',selected.donor_name],['Amount','₹'+Number(selected.amount).toLocaleString('en-IN')],['Email',selected.donor_email],['Phone',selected.donor_phone||'Not provided'],['PAN',selected.donor_pan||'Not provided'],['Payment method',selected.payment_method],['Created',new Date(selected.created_at).toLocaleString('en-IN')],['Reviewed',selected.reviewed_at?new Date(selected.reviewed_at).toLocaleString('en-IN'):'—'],['Reviewed by',selected.reviewed_by||'—'],['Message',selected.donor_message||'No message']];
  details.innerHTML=fields.map(([a,b])=>`<div class="detail"><small>${esc(a)}</small>${esc(b)}</div>`).join('');
  modal.classList.remove('hidden');document.getElementById('action-msg').textContent='';
}
async function setStatus(status){
  if(!selected)return;
  const confirmText=status==='Verified'?'Confirm you checked the actual school account and want to mark this donation Verified?':'Change this donation to '+status+'?';
  if(!confirm(confirmText))return;
  try{await api('staff-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({donation_ref:selected.donation_ref,status})});document.getElementById('action-msg').textContent='Updated to '+status;await load();openRecord(selected.donation_ref)}
  catch(e){document.getElementById('action-msg').textContent=e.message}
}
document.getElementById('mark-verified').onclick=()=>setStatus('Verified');
document.getElementById('mark-rejected').onclick=()=>setStatus('Rejected');
document.getElementById('mark-pending').onclick=()=>setStatus('Pending');
document.getElementById('close').onclick=()=>modal.classList.add('hidden');
document.getElementById('refresh').onclick=load;search.oninput=render;filter.onchange=render;
if(token){api('staff-me').then(d=>showApp(d.username)).catch(()=>{sessionStorage.removeItem('wkdp_staff_token')})}
</script>
</body></html>
